tools/rpg_object_editor/v2_select = 파트 선택 및 이동
tools/rpg_object_editor/v2_player = 캐릭터 이동
tools/rpg_object_editor/v2_layers = 오브젝트 파트
tools/rpg_object_editor/v2_settings = 선택한 파트
tools/rpg_object_editor/v2_test = 가림 확인
tools/rpg_object_editor/v2_auto_depth = 이미지에서 깊이점 찾기
tools/rpg_object_editor/v2_player_hint = 파란 발 원은 어떤 모드에서든 드래그할 수 있습니다. 또는 캐릭터 이동을 선택하고 캔버스를 클릭하세요.
tools/rpg_object_editor/v2_scale = 보이는 캐릭터 높이는 1.8칸입니다. PNG 해상도나 게임과 무관합니다.
tools/rpg_object_editor/v2_put_behind = 파트 뒤에 캐릭터 배치
tools/rpg_object_editor/v2_put_front = 파트 앞에 캐릭터 배치
tools/rpg_object_editor/v2_front_status = 현재 캐릭터가 파트 앞에 그려집니다.
tools/rpg_object_editor/v2_behind_status = 현재 파트가 캐릭터 앞에 그려집니다.
tools/rpg_object_editor/v2_drag_player = 캐릭터: 원을 드래그
tools/rpg_object_editor/v2_behind_line = 뒤: 파트가 캐릭터를 가림
tools/rpg_object_editor/v2_front_line = 앞: 캐릭터가 파트를 가림
tools/rpg_object_editor/v2_depth_hint = 빨간 십자를 책상 앞쪽 가장자리로 드래그하거나 깊이 도구로 해당 위치를 클릭하세요.
tools/rpg_object_editor/v2_always_front = 캐릭터 앞은 항상 캐릭터를 가립니다. 책상 양쪽을 사용하려면 깊이 순서를 선택하세요.
tools/rpg_object_editor/v2_always_back = 캐릭터 뒤는 항상 캐릭터를 위에 그립니다. 책상에는 깊이 순서를 선택하세요.
tools/rpg_object_editor/v2_add = 이미지 추가
tools/rpg_object_editor/v2_focus = 선택 파트 확대
