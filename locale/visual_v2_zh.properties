tools/rpg_object_editor/v2_select = 选择并移动部件
tools/rpg_object_editor/v2_player = 移动角色
tools/rpg_object_editor/v2_layers = 对象部件
tools/rpg_object_editor/v2_settings = 所选部件
tools/rpg_object_editor/v2_test = 遮挡测试
tools/rpg_object_editor/v2_auto_depth = 从图片识别深度点
tools/rpg_object_editor/v2_player_hint = 蓝色圆圈表示脚底，可在任何模式中拖动。也可选择移动角色后点击画布。
tools/rpg_object_editor/v2_scale = 角色可见轮廓高度为1.8格，不受PNG分辨率或游戏影响。
tools/rpg_object_editor/v2_put_behind = 将角色放在部件后面
tools/rpg_object_editor/v2_put_front = 将角色放在部件前面
tools/rpg_object_editor/v2_front_status = 当前角色绘制在部件前面。
tools/rpg_object_editor/v2_behind_status = 当前部件绘制在角色前面。
tools/rpg_object_editor/v2_drag_player = 角色：拖动圆圈
tools/rpg_object_editor/v2_behind_line = 后方：物体遮挡角色
tools/rpg_object_editor/v2_front_line = 前方：角色遮挡物体
tools/rpg_object_editor/v2_depth_hint = 将红色十字拖到桌子前沿，或使用深度工具点击该位置。
tools/rpg_object_editor/v2_always_front = 角色前方模式始终遮挡角色。要从两侧绕桌，请选择按深度排序。
tools/rpg_object_editor/v2_always_back = 角色后方模式始终将角色绘制在上层。桌子应选择按深度排序。
tools/rpg_object_editor/v2_add = 添加图片
tools/rpg_object_editor/v2_focus = 放大所选部件
