tools/rpg_object_editor/import_read = Файл не читается: {0}
tools/rpg_object_editor/import_surface_size = {0} x {1} px: материал поверхности должен быть квадратом {3} px (размер патча карты). Всё равно импортируется.
tools/rpg_object_editor/import_title = Выберите PNG для импорта
