mod_rpg_object_editor_name = Редактор объектов RPG
mod_rpg_object_editor_desc = Правит объекты RPG (поверхности, стены, предметы, персонажи) во время игры: форма по виду объекта, картинка, клетки, точка, взаимодействие и наследование. Предпросмотр сверху и в изометрии — рисует сама игра. Чужой объект правится патчем в свой мод.
tools/rpg_object_editor/title = Объекты RPG
tools/rpg_object_editor/form = Форма
tools/rpg_object_editor/form_tip = surface — материал земли; segment — клетка стены или забора; sprite — предмет на сетке; actor — персонаж на одной клетке
tools/rpg_object_editor/name = Название
tools/rpg_object_editor/category = Категория
tools/rpg_object_editor/category_tip = Свободная метка для палитры и папки картинок: container, vegetation, building…
tools/rpg_object_editor/extends = Наследует
tools/rpg_object_editor/extends_tip = Id родительского объекта: поля, которых здесь нет, берутся у него
tools/rpg_object_editor/material = Материал
tools/rpg_object_editor/material_tip = Квадратная картинка материала (сторона — PatchSize карты) в группе rpg_images
tools/rpg_object_editor/diffuse = Смешивание
tools/rpg_object_editor/diffuse_tip = Ширина перехода к соседним материалам (DiffuseStrength); 0 — резкий край
tools/rpg_object_editor/segment_image = Картинка клетки
tools/rpg_object_editor/segment_image_tip = Одна клетка шириной; высота — Segment.Height. Угол и Т-образные части собирает игра
tools/rpg_object_editor/connect = Связь
tools/rpg_object_editor/connect_tip = Сегменты с одинаковой связью соединяются между собой. Пусто — id объекта
tools/rpg_object_editor/along = Направление
tools/rpg_object_editor/along_tip = Направление вертикальной плоскости в изометрии: auto — по соседям, x или y
tools/rpg_object_editor/part_image = Картинка
tools/rpg_object_editor/part_image_tip = Первая часть объекта (путь в rpg_images). Остальные части — в «Прочих полях»
tools/rpg_object_editor/geometry = Геометрия
tools/rpg_object_editor/geometry_tip = upright — стоит на якоре; ground — лежит на земле; plane — вертикальная плоскость на клетке; quad — четырёхугольник по точкам
tools/rpg_object_editor/crop = Вырезка
tools/rpg_object_editor/crop_tip = x, y, w, h в пикселях картинки; пусто — вся картинка
tools/rpg_object_editor/footprint = Клетки
tools/rpg_object_editor/footprint_tip = w, h — сколько клеток занимает объект (след, зона проходимости, выбор в редакторе)
tools/rpg_object_editor/anchor = Точка
tools/rpg_object_editor/anchor_tip = x, y в клетках от левого верхнего угла объекта: точка, на которой он стоит (сортировка и основание)
tools/rpg_object_editor/charset = Чарсет
tools/rpg_object_editor/charset_tip = Лист ходьбы в группе charsets (3 колонки × 4 ряда)
tools/rpg_object_editor/facing = Взгляд
tools/rpg_object_editor/column = Колонка
tools/rpg_object_editor/trigger = Триггер
tools/rpg_object_editor/trigger_tip = Use — когда игрок нажимает действие рядом; Step — когда входит на клетку
tools/rpg_object_editor/scenario = Сценарий
tools/rpg_object_editor/scenario_tip = Путь к сценарию (группа scenarios). Строки команд и телепорт — в «Прочих полях»
tools/rpg_object_editor/projection = Проекция
tools/rpg_object_editor/projection_tip = Какие проекции показывать: обе рядом, только сверху или только изометрию
tools/rpg_object_editor/projection_both = Обе
tools/rpg_object_editor/projection_top = Сверху
tools/rpg_object_editor/projection_iso = Изометрия
tools/rpg_object_editor/renderer_missing = Проекция «{0}» не подключена: нужен её мод рендера
tools/rpg_object_editor/commands = Строки сценария
tools/rpg_object_editor/commands_tip = Строки, которые выполняет взаимодействие, по одной в строке. С телепортом они не нужны.
tools/rpg_object_editor/dialog_map = Выберите карту
tools/rpg_object_editor/dialog_scenario = Выберите сценарий
tools/rpg_object_editor/diffuse_on = Смешивать с соседями
tools/rpg_object_editor/diffuse_on_tip = Выключено для чётких полов: материал не смешивается с соседними.
tools/rpg_object_editor/drag_hint = Перетащите жёлтый маркер якоря на любом предпросмотре, чтобы задать, где стоит объект. Используется клетка под указателем.
tools/rpg_object_editor/draw_order = Порядок отрисовки
tools/rpg_object_editor/draw_order_default = по геометрии
tools/rpg_object_editor/draw_order_tip = Когда части рисуются относительно персонажей. Пусто: каждая часть решает сама.
tools/rpg_object_editor/facing_keep = не менять
tools/rpg_object_editor/footprint_cell_tip = Щелчок переключает клетку между блокирующей (#) и свободной (.)
tools/rpg_object_editor/footprint_height = Высота (клеток)
tools/rpg_object_editor/footprint_width = Ширина (клеток)
tools/rpg_object_editor/footprint_mask_hint = # блокирует ходьбу, . свободна. Новый размер сбрасывает маску к твёрдости объекта.
tools/rpg_object_editor/hidden = Скрыт
tools/rpg_object_editor/hidden_tip = Не рисуется, не твёрдый и не интерактивный (подобранный предмет, побеждённый враг).
tools/rpg_object_editor/import = Импорт PNG...
tools/rpg_object_editor/import_bad_name = У картинки нужны имя файла и категория из букв, цифр, _ или -.
tools/rpg_object_editor/import_done = Картинка импортирована: {0}
tools/rpg_object_editor/import_empty = Картинка пустая (ширина или высота 0).
tools/rpg_object_editor/import_exists = rpg_images/{0}.png уже есть. Выберите другое имя файла.
tools/rpg_object_editor/import_grid = {0} x {1} px: сторона не кратна размеру клетки ({2} px). Части на сетке обрежутся или оставят зазоры.
tools/rpg_object_editor/import_hint = PNG копируется в rpg_images/<категория>/ этого мода и становится картинкой.
tools/rpg_object_editor/import_not_for_actor = У актёра чарсет, а не картинка. Импортируйте PNG в спрайт, поверхность или сегмент.
