tools/rpg_object_editor/v2_select = Выбрать и двигать часть
tools/rpg_object_editor/v2_player = Перемещать персонажа
tools/rpg_object_editor/v2_layers = Части объекта
tools/rpg_object_editor/v2_settings = Выбранная часть
tools/rpg_object_editor/v2_test = Проверка перекрытия
tools/rpg_object_editor/v2_auto_depth = Определить глубину по изображению
tools/rpg_object_editor/v2_player_hint = Синий круг — стопы персонажа. Тяните его мышью в любом режиме или включите «Перемещать персонажа» и щёлкните на холсте.
tools/rpg_object_editor/v2_scale = Силуэт персонажа: 1,8 клетки по высоте. Размер PNG и выбранная игра на масштаб не влияют.
tools/rpg_object_editor/v2_put_behind = Поставить персонажа за частью
tools/rpg_object_editor/v2_put_front = Поставить персонажа перед частью
tools/rpg_object_editor/v2_front_status = Сейчас персонаж рисуется перед частью.
tools/rpg_object_editor/v2_behind_status = Сейчас часть рисуется перед персонажем.
tools/rpg_object_editor/v2_drag_player = Персонаж — тяните за круг
tools/rpg_object_editor/v2_behind_line = ЗА ЧАСТЬЮ: предмет перекрывает героя
tools/rpg_object_editor/v2_front_line = ПЕРЕД ЧАСТЬЮ: герой перекрывает предмет
tools/rpg_object_editor/v2_depth_hint = Красный крест и линия задают глубину. Перетащите крест к переднему краю стола или включите инструмент точки перекрытия и щёлкните там.
tools/rpg_object_editor/v2_always_front = Выбрано «Над персонажами»: часть всегда закрывает героя. Для обхода стола с двух сторон выберите «По глубине».
tools/rpg_object_editor/v2_always_back = Выбрано «Под персонажами»: герой всегда сверху. Для стола выберите «По глубине».
tools/rpg_object_editor/v2_add = Добавить изображение
tools/rpg_object_editor/v2_focus = Приблизить выбранную часть
