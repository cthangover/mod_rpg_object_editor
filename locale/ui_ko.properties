mod_rpg_object_editor_name = RPG 오브젝트 편집기
mod_rpg_object_editor_desc = RPG 오브젝트(바닥, 벽, 소품, 캐릭터)를 게임 실행 중에 편집합니다. 모양별 양식, 그림, 칸, 기준점, 상호작용, 상속. 위에서 본 그림과 등각 그림 미리보기는 게임이 직접 그립니다. 다른 모드의 오브젝트는 내 모드의 패치로 편집합니다.
tools/rpg_object_editor/title = RPG 오브젝트
tools/rpg_object_editor/form = 형태
tools/rpg_object_editor/form_tip = surface — 바닥 재질, segment — 벽이나 울타리의 한 칸, sprite — 칸 위의 소품, actor — 한 칸에 선 캐릭터
tools/rpg_object_editor/name = 이름
tools/rpg_object_editor/category = 범주
tools/rpg_object_editor/category_tip = 팔레트와 그림 폴더용 자유 꼬리표: container, vegetation, building…
tools/rpg_object_editor/extends = 상속
tools/rpg_object_editor/extends_tip = 부모 오브젝트의 ID: 여기 없는 필드는 부모에게서 가져옵니다
tools/rpg_object_editor/material = 재질
tools/rpg_object_editor/material_tip = rpg_images 그룹의 정사각형 재질 그림(한 변은 맵의 PatchSize)
tools/rpg_object_editor/diffuse = 혼합
tools/rpg_object_editor/diffuse_tip = 인접 재질과 섞이는 폭(DiffuseStrength); 0이면 날카로운 경계
tools/rpg_object_editor/segment_image = 칸 그림
tools/rpg_object_editor/segment_image_tip = 폭은 한 칸, 높이는 Segment.Height. 모서리와 T자는 게임이 조립합니다
tools/rpg_object_editor/connect = 연결
tools/rpg_object_editor/connect_tip = 같은 연결 키의 칸끼리 이어집니다. 비우면 오브젝트 ID
tools/rpg_object_editor/along = 방향
tools/rpg_object_editor/along_tip = 등각에서 세로 면의 방향: auto는 이웃에서, 또는 x나 y
tools/rpg_object_editor/part_image = 그림
tools/rpg_object_editor/part_image_tip = 오브젝트의 첫 번째 부품(rpg_images 안의 경로). 나머지 부품은 "기타 필드"
tools/rpg_object_editor/geometry = 기하
tools/rpg_object_editor/geometry_tip = upright — 기준점 위에 섬; ground — 바닥에 누움; plane — 칸 위의 세로 면; quad — 점으로 정한 사각형
tools/rpg_object_editor/crop = 잘라내기
tools/rpg_object_editor/crop_tip = 그림 픽셀 단위 x, y, w, h; 비우면 그림 전체
tools/rpg_object_editor/footprint = 칸
tools/rpg_object_editor/footprint_tip = w, h — 오브젝트가 차지하는 칸 수(발자국, 통행, 선택)
tools/rpg_object_editor/anchor = 기준점
tools/rpg_object_editor/anchor_tip = 오브젝트 왼쪽 위 모서리에서 칸 단위 x, y: 서 있는 점(정렬과 밑면)
tools/rpg_object_editor/charset = 캐릭터 시트
tools/rpg_object_editor/charset_tip = charsets 그룹의 걷기 시트(3열 × 4행)
tools/rpg_object_editor/facing = 바라봄
tools/rpg_object_editor/column = 열
tools/rpg_object_editor/trigger = 트리거
tools/rpg_object_editor/trigger_tip = Use — 근처에서 행동 키를 누를 때; Step — 칸에 들어설 때
tools/rpg_object_editor/scenario = 시나리오
tools/rpg_object_editor/scenario_tip = 시나리오 경로(scenarios 그룹). 명령 줄과 순간이동은 "기타 필드"
tools/rpg_object_editor/projection = 투영
tools/rpg_object_editor/projection_tip = 표시할 투영: 둘 다 나란히, 위에서 본 그림만, 또는 등각만
tools/rpg_object_editor/projection_both = 둘 다
tools/rpg_object_editor/projection_top = 위에서
tools/rpg_object_editor/projection_iso = 등각
tools/rpg_object_editor/renderer_missing = 투영 "{0}"이(가) 로드되지 않았습니다: 렌더 모드가 필요합니다
tools/rpg_object_editor/commands = 스크립트 줄
tools/rpg_object_editor/commands_tip = 상호작용이 실행하는 줄(한 줄에 하나). 순간이동을 설정하면 필요 없습니다.
tools/rpg_object_editor/dialog_map = 맵 선택
tools/rpg_object_editor/dialog_scenario = 시나리오 선택
tools/rpg_object_editor/diffuse_on = 이웃 재질과 섞기
tools/rpg_object_editor/diffuse_on_tip = 선명한 바닥에는 끕니다. 재질이 옆 재질과 섞이지 않습니다.
tools/rpg_object_editor/drag_hint = 어느 미리보기에서든 노란 앵커 표시를 끌어 오브젝트가 서는 위치를 정합니다. 포인터 아래의 칸이 쓰입니다.
tools/rpg_object_editor/draw_order = 그리기 순서
tools/rpg_object_editor/draw_order_default = 형태에 따름
tools/rpg_object_editor/draw_order_tip = 파츠가 캐릭터에 대해 그려지는 순서. 비워 두면 각 파츠가 정합니다.
tools/rpg_object_editor/facing_keep = 유지
tools/rpg_object_editor/footprint_cell_tip = 클릭하면 칸을 막힘(#)과 통행 가능(.) 사이에서 바꿉니다
tools/rpg_object_editor/footprint_height = 높이(칸)
tools/rpg_object_editor/footprint_width = 너비(칸)
tools/rpg_object_editor/footprint_mask_hint = #은 이동을 막고 .은 통행 가능합니다. 크기를 바꾸면 마스크는 오브젝트의 고체 설정으로 돌아갑니다.
tools/rpg_object_editor/hidden = 숨김
tools/rpg_object_editor/hidden_tip = 그리지 않고, 막지 않으며, 상호작용하지 않습니다(주운 물건, 쓰러진 적).
tools/rpg_object_editor/import = PNG 가져오기...
tools/rpg_object_editor/import_bad_name = 그림에는 파일 이름과, 문자·숫자·_·- 로 된 분류가 필요합니다.
tools/rpg_object_editor/import_done = 그림을 가져왔습니다: {0}
tools/rpg_object_editor/import_empty = 그림이 비어 있습니다(너비 또는 높이가 0).
tools/rpg_object_editor/import_exists = rpg_images/{0}.png 이(가) 이미 있습니다. 다른 파일 이름을 고르세요.
tools/rpg_object_editor/import_grid = {0} x {1} px: 한 변이 맵 칸 크기({2} px)의 배수가 아닙니다. 격자에서 파츠가 잘리거나 틈이 생깁니다.
tools/rpg_object_editor/import_hint = PNG는 이 모드의 rpg_images/<분류>/ 에 복사되고 그림으로 설정됩니다.
tools/rpg_object_editor/import_not_for_actor = 액터는 그림이 아니라 캐릭터 시트(charset)를 씁니다. PNG는 스프라이트, 표면 또는 세그먼트에 가져오세요.
tools/rpg_object_editor/import_not_png = 이 파일은 PNG 그림이 아닙니다.
tools/rpg_object_editor/import_read = 파일을 읽을 수 없습니다: {0}
tools/rpg_object_editor/import_surface_size = {0} x {1} px: 표면 재질은 {3} px 정사각형이어야 합니다(맵의 패치 크기). 그래도 가져옵니다.
tools/rpg_object_editor/import_title = 가져올 PNG 선택
tools/rpg_object_editor/interact_add = 상호작용 추가
tools/rpg_object_editor/interact_clear = 상호작용 제거
tools/rpg_object_editor/light_add = 빛 추가
tools/rpg_object_editor/light_at = 위치(칸, 비우면 중앙)
tools/rpg_object_editor/light_at_tip = 오브젝트 원점에서 칸 단위로 잰 빛의 위치: "x, y". 비우면 점유 영역의 중앙입니다.
tools/rpg_object_editor/light_color = 색
tools/rpg_object_editor/light_color_tip = 빛의 색입니다. 알파가 세기가 됩니다.
tools/rpg_object_editor/light_item = 빛 {0}
tools/rpg_object_editor/light_main = 주 빛
tools/rpg_object_editor/light_main_tip = 오브젝트 자체가 내는 빛(램프, 불).
tools/rpg_object_editor/light_radius = 반경(칸)
tools/rpg_object_editor/light_radius_tip = 빛이 닿는 거리. 그 지점에서 완전히 사라집니다.
tools/rpg_object_editor/light_remove = 빛 제거
tools/rpg_object_editor/map_none = 맵 없음
tools/rpg_object_editor/map_pick = 맵 선택...
tools/rpg_object_editor/number_invalid = 숫자가 아닙니다. 1.5 또는 0 같은 숫자를 쉼표로 구분해 쓰세요.
tools/rpg_object_editor/part_add = 파츠 추가
tools/rpg_object_editor/part_at = 오프셋(칸)
tools/rpg_object_editor/part_at_tip = 오브젝트 원점에서 본 파츠의 왼쪽 위: "x, y". 비우면 0, 0. 음수도 됩니다.
tools/rpg_object_editor/part_down = 아래로
tools/rpg_object_editor/part_id = Id
tools/rpg_object_editor/part_only = 표시할 투영
tools/rpg_object_editor/part_only_any = 모든 투영
tools/rpg_object_editor/part_only_tip = 파츠를 한 투영(topdown 또는 isometric)에만 씁니다. 비우면 둘 다에 표시합니다.
tools/rpg_object_editor/part_points = 모서리(quad)
tools/rpg_object_editor/part_points_tip = 사각형의 네 모서리: 왼쪽 위, 오른쪽 위, 오른쪽 아래, 왼쪽 아래, 각각 "x, y, z", ";"로 구분. 형태 quad에서만 씁니다.
tools/rpg_object_editor/part_remove = 파츠 제거
tools/rpg_object_editor/part_size = 크기(칸)
tools/rpg_object_editor/part_size_tip = 칸 단위 너비와 높이: "w, h". 비우면 잘라낸 크기를 맵 타일 크기로 나눈 값입니다.
tools/rpg_object_editor/part_title = 파츠 {0}
tools/rpg_object_editor/part_up = 위로
tools/rpg_object_editor/route_every = 걸음당 초
tools/rpg_object_editor/route_every_tip = 경로의 두 걸음 사이 시간.
tools/rpg_object_editor/route_on = 경로를 따라 움직임
tools/rpg_object_editor/route_on_tip = 오브젝트가 정해진 경로를 스스로 걷습니다(행인, 수레).
tools/rpg_object_editor/route_repeat = 반복
tools/rpg_object_editor/route_repeat_tip = 마지막 걸음 뒤에 경로를 처음부터 다시 시작합니다.
tools/rpg_object_editor/route_steps = 걸음
tools/rpg_object_editor/route_steps_tip = 쉼표로 구분: up, down, left, right, random, toward, away, wait, face_up, face_down, face_left, face_right.
tools/rpg_object_editor/scenario_none = 시나리오 없음
tools/rpg_object_editor/scenario_pick = 시나리오 선택...
tools/rpg_object_editor/section_flags = 플래그
tools/rpg_object_editor/section_footprint = 점유 영역
tools/rpg_object_editor/section_interact = 상호작용
tools/rpg_object_editor/section_lights = 빛
tools/rpg_object_editor/section_parts = 파츠
tools/rpg_object_editor/section_picture = 그림
tools/rpg_object_editor/section_route = 경로
tools/rpg_object_editor/section_states = 상태
tools/rpg_object_editor/section_variants = 변형
tools/rpg_object_editor/segment_height = 높이(칸)
tools/rpg_object_editor/segment_height_tip = 울타리 조각의 높이(칸).
tools/rpg_object_editor/show = 표시
tools/rpg_object_editor/show_default = 오브젝트 그대로
tools/rpg_object_editor/show_state = 상태 {0}: {1}
tools/rpg_object_editor/show_tip = 미리보기는 오브젝트의 기본 모습, 변형 또는 상태를 보여 줍니다.
tools/rpg_object_editor/show_variant = 변형: {0}
tools/rpg_object_editor/solid = 이동을 막음
tools/rpg_object_editor/solid_default = 형태에 따름
tools/rpg_object_editor/solid_no = 아니요
tools/rpg_object_editor/solid_tip = 오브젝트가 이동을 막는지 여부. 형태에 따르면 스프라이트는 막고 표면은 막지 않습니다.
tools/rpg_object_editor/solid_yes = 예
tools/rpg_object_editor/state_add = 상태 추가
tools/rpg_object_editor/state_down = 아래로
tools/rpg_object_editor/state_id = Id
tools/rpg_object_editor/state_item = {0}. {1}
tools/rpg_object_editor/state_remove = 상태 제거
tools/rpg_object_editor/state_up = 위로
tools/rpg_object_editor/state_when = 조건
tools/rpg_object_editor/state_when_tip = 조건이 참인 동안 상태가 적용됩니다. 예: self.open == 1. 참인 마지막 상태가 이깁니다.
tools/rpg_object_editor/tele_dir = 도착 시 방향
tools/rpg_object_editor/tele_tip = 목표 맵에서 플레이어가 도착하는 칸.
tools/rpg_object_editor/tele_x = 열(x)
tools/rpg_object_editor/tele_y = 행(y)
tools/rpg_object_editor/teleport = 순간이동 위치
tools/rpg_object_editor/teleport_remove = 순간이동 제거
tools/rpg_object_editor/variant_add = 변형 추가
tools/rpg_object_editor/variant_name = 변형 이름(예: winter)
tools/rpg_object_editor/variant_picture = 그림
tools/rpg_object_editor/variant_picture_tip = 이 변형이 대신 쓰는 그림.
tools/rpg_object_editor/variant_remove = 변형 제거
tools/rpg_object_editor/water = 물
tools/rpg_object_editor/water_tip = 표면이 물입니다.
tools/rpg_object_editor/part_sort_offset = 정렬 오프셋(칸)
