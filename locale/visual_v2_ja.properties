tools/rpg_object_editor/v2_select = パーツを選択・移動
tools/rpg_object_editor/v2_player = キャラクターを移動
tools/rpg_object_editor/v2_layers = オブジェクトのパーツ
tools/rpg_object_editor/v2_settings = 選択中のパーツ
tools/rpg_object_editor/v2_test = 重なりの確認
tools/rpg_object_editor/v2_auto_depth = 画像から奥行き点を検出
tools/rpg_object_editor/v2_player_hint = 青い足元の円はどのモードでもドラッグできます。またはキャラクター移動を選びキャンバスをクリックします。
tools/rpg_object_editor/v2_scale = キャラクターの見える高さは1.8セルです。PNGの解像度やゲームによって変わりません。
tools/rpg_object_editor/v2_put_behind = パーツの後ろに配置
tools/rpg_object_editor/v2_put_front = パーツの前に配置
tools/rpg_object_editor/v2_front_status = 現在キャラクターが手前に描画されます。
tools/rpg_object_editor/v2_behind_status = 現在パーツが手前に描画されます。
tools/rpg_object_editor/v2_drag_player = キャラクター：円をドラッグ
tools/rpg_object_editor/v2_behind_line = 奥：パーツがキャラクターを隠す
tools/rpg_object_editor/v2_front_line = 手前：キャラクターがパーツを隠す
tools/rpg_object_editor/v2_depth_hint = 赤い十字を机の手前側の端にドラッグするか、奥行きツールでその位置をクリックします。
tools/rpg_object_editor/v2_always_front = キャラクターの前では常にキャラクターを隠します。机の両側を使う場合は奥行き順を選んでください。
tools/rpg_object_editor/v2_always_back = キャラクターの後ろでは常にキャラクターが上です。机には奥行き順を選んでください。
tools/rpg_object_editor/v2_add = 画像を追加
tools/rpg_object_editor/v2_focus = 選択パーツにズーム
