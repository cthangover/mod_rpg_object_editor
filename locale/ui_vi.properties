mod_rpg_object_editor_name = Trình sửa đối tượng RPG
mod_rpg_object_editor_desc = Sửa đối tượng RPG (bề mặt, tường, vật phẩm, nhân vật) khi game đang chạy: biểu mẫu theo hình dạng, hình ảnh, ô chiếm, điểm neo, tương tác và kế thừa. Xem trước từ trên xuống và isometric do chính game vẽ. Đối tượng của mod khác được sửa dưới dạng bản vá trong mod của bạn.
tools/rpg_object_editor/title = Đối tượng RPG
tools/rpg_object_editor/form = Hình dạng
tools/rpg_object_editor/form_tip = surface — chất liệu mặt đất; segment — một ô tường hoặc hàng rào; sprite — vật trên lưới; actor — nhân vật đứng trên một ô
tools/rpg_object_editor/name = Tên
tools/rpg_object_editor/category = Danh mục
tools/rpg_object_editor/category_tip = Nhãn tự do cho bảng chọn và thư mục hình: container, vegetation, building…
tools/rpg_object_editor/extends = Kế thừa
tools/rpg_object_editor/extends_tip = Id đối tượng cha: trường không có ở đây sẽ lấy từ cha
tools/rpg_object_editor/material = Chất liệu
tools/rpg_object_editor/material_tip = Hình vuông của chất liệu (cạnh = PatchSize của bản đồ) trong nhóm rpg_images
tools/rpg_object_editor/diffuse = Pha trộn
tools/rpg_object_editor/diffuse_tip = Độ rộng pha với chất liệu bên cạnh (DiffuseStrength); 0 là mép cứng
tools/rpg_object_editor/segment_image = Hình ô
tools/rpg_object_editor/segment_image_tip = Rộng một ô; chiều cao là Segment.Height. Góc và chữ T do game ghép
tools/rpg_object_editor/connect = Nối
tools/rpg_object_editor/connect_tip = Các đoạn cùng khóa nối sẽ nối với nhau. Để trống — id của đối tượng
tools/rpg_object_editor/along = Hướng
tools/rpg_object_editor/along_tip = Hướng mặt phẳng đứng trong isometric: auto — theo ô bên cạnh, hoặc x hay y
tools/rpg_object_editor/part_image = Hình
tools/rpg_object_editor/part_image_tip = Phần đầu tiên của đối tượng (đường dẫn trong rpg_images). Các phần khác nằm ở "trường khác"
tools/rpg_object_editor/geometry = Hình học
tools/rpg_object_editor/geometry_tip = upright — đứng trên điểm neo; ground — nằm trên mặt đất; plane — mặt phẳng đứng trên ô; quad — tứ giác theo các điểm
tools/rpg_object_editor/crop = Cắt
tools/rpg_object_editor/crop_tip = x, y, w, h theo điểm ảnh; để trống — cả hình
tools/rpg_object_editor/footprint = Ô
tools/rpg_object_editor/footprint_tip = w, h — số ô đối tượng chiếm (dấu chân, khả năng đi qua, vùng chọn)
tools/rpg_object_editor/anchor = Điểm neo
tools/rpg_object_editor/anchor_tip = x, y theo ô từ góc trên trái của đối tượng: điểm đứng (thứ tự vẽ và chân)
tools/rpg_object_editor/charset = Charset
tools/rpg_object_editor/charset_tip = Tấm đi bộ trong nhóm charsets (3 cột × 4 hàng)
tools/rpg_object_editor/facing = Hướng nhìn
tools/rpg_object_editor/column = Cột
tools/rpg_object_editor/trigger = Kích hoạt
tools/rpg_object_editor/trigger_tip = Use — khi người chơi bấm phím hành động gần đó; Step — khi bước vào ô
tools/rpg_object_editor/scenario = Kịch bản
tools/rpg_object_editor/scenario_tip = Đường dẫn kịch bản (nhóm scenarios). Dòng lệnh và dịch chuyển nằm ở "trường khác"
tools/rpg_object_editor/projection = Phép chiếu
tools/rpg_object_editor/projection_tip = Hiển thị phép chiếu nào: cả hai cạnh nhau, chỉ từ trên xuống hoặc chỉ isometric
tools/rpg_object_editor/projection_both = Cả hai
tools/rpg_object_editor/projection_top = Từ trên xuống
tools/rpg_object_editor/projection_iso = Isometric
tools/rpg_object_editor/renderer_missing = Phép chiếu "{0}" chưa được nạp: cần mod hiển thị của nó
tools/rpg_object_editor/commands = Dòng kịch bản
tools/rpg_object_editor/commands_tip = Các dòng tương tác chạy, mỗi dòng một lệnh. Khi đặt dịch chuyển thì không cần.
tools/rpg_object_editor/dialog_map = Chọn bản đồ
tools/rpg_object_editor/dialog_scenario = Chọn kịch bản
tools/rpg_object_editor/diffuse_on = Hòa trộn với ô bên cạnh
tools/rpg_object_editor/diffuse_on_tip = Tắt cho sàn rõ nét: chất liệu không hòa trộn với chất liệu bên cạnh.
tools/rpg_object_editor/drag_hint = Kéo dấu neo màu vàng trên bất kỳ bản xem trước nào để đặt vị trí đứng của vật thể. Dùng ô dưới con trỏ.
tools/rpg_object_editor/draw_order = Thứ tự vẽ
tools/rpg_object_editor/draw_order_default = theo hình học
tools/rpg_object_editor/draw_order_tip = Khi nào các phần được vẽ so với nhân vật. Để trống: mỗi phần tự quyết định.
tools/rpg_object_editor/facing_keep = giữ nguyên
tools/rpg_object_editor/footprint_cell_tip = Nhấn để đổi ô giữa chặn (#) và trống (.)
tools/rpg_object_editor/footprint_height = Cao (ô)
tools/rpg_object_editor/footprint_width = Rộng (ô)
tools/rpg_object_editor/footprint_mask_hint = # chặn đường đi, . là trống. Đổi kích thước sẽ đặt lại mặt nạ theo độ rắn của vật thể.
tools/rpg_object_editor/hidden = Ẩn
tools/rpg_object_editor/hidden_tip = Không vẽ, không chặn và không tương tác được (vật phẩm đã nhặt, kẻ địch đã bị đánh bại).
tools/rpg_object_editor/import = Nhập PNG...
tools/rpg_object_editor/import_bad_name = Hình cần có tên tệp và danh mục gồm chữ, số, _ hoặc -.
tools/rpg_object_editor/import_done = Đã nhập hình: {0}
tools/rpg_object_editor/import_empty = Hình trống (chiều rộng hoặc chiều cao bằng 0).
tools/rpg_object_editor/import_exists = rpg_images/{0}.png đã có. Hãy chọn tên tệp khác.
tools/rpg_object_editor/import_grid = {0} x {1} px: một cạnh không phải bội số của kích thước ô ({2} px). Các phần sẽ bị cắt hoặc để lại khe hở trên lưới.
tools/rpg_object_editor/import_hint = PNG được chép vào rpg_images/<danh mục>/ của mod này và đặt làm hình.
tools/rpg_object_editor/import_not_for_actor = Nhân vật dùng bảng dáng (charset), không dùng hình. Hãy nhập PNG vào sprite, bề mặt hoặc đoạn.
tools/rpg_object_editor/import_not_png = Tệp này không phải hình PNG.
tools/rpg_object_editor/import_read = Không đọc được tệp: {0}
tools/rpg_object_editor/import_surface_size = {0} x {1} px: chất liệu bề mặt nên là hình vuông {3} px (kích thước mảng của bản đồ). Vẫn được nhập.
tools/rpg_object_editor/import_title = Chọn PNG để nhập
