tools/rpg_object_editor/map_pick = Chọn bản đồ...
tools/rpg_object_editor/number_invalid = Không phải là số. Hãy dùng số như 1.5 hoặc 0, ngăn cách bằng dấu phẩy.
tools/rpg_object_editor/part_add = Thêm phần
