tools/rpg_object_editor/map_pick = Elegir mapa...
tools/rpg_object_editor/number_invalid = No es un número. Use números como 1.5 o 0, separados por comas.
tools/rpg_object_editor/part_add = Añadir parte
tools/rpg_object_editor/part_at = Desplazamiento (celdas)
