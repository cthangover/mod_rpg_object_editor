mod_rpg_object_editor_name = Editor de objetos RPG
mod_rpg_object_editor_desc = Edita objetos RPG (superficies, muros, objetos, personajes) mientras corre el juego: formulario según la forma, imagen, celdas, ancla, interacción y herencia. Vista previa cenital e isométrica, dibujada por el propio juego. Un objeto ajeno se edita como parche en tu mod.
tools/rpg_object_editor/title = Objetos RPG
tools/rpg_object_editor/form = Forma
tools/rpg_object_editor/form_tip = surface — material del suelo; segment — celda de muro o valla; sprite — objeto en la cuadrícula; actor — personaje en una celda
tools/rpg_object_editor/name = Nombre
tools/rpg_object_editor/category = Categoría
tools/rpg_object_editor/category_tip = Etiqueta libre para la paleta y la carpeta de imágenes: container, vegetation, building…
tools/rpg_object_editor/extends = Hereda de
tools/rpg_object_editor/extends_tip = Id del objeto padre: los campos que aquí no existen se toman de él
tools/rpg_object_editor/material = Material
tools/rpg_object_editor/material_tip = Imagen cuadrada del material (lado = PatchSize del mapa) en el grupo rpg_images
tools/rpg_object_editor/diffuse = Mezcla
tools/rpg_object_editor/diffuse_tip = Ancho de la mezcla con los materiales vecinos (DiffuseStrength); 0 — borde duro
tools/rpg_object_editor/segment_image = Imagen de la celda
tools/rpg_object_editor/segment_image_tip = Una celda de ancho; la altura es Segment.Height. El juego monta esquinas y uniones en T
tools/rpg_object_editor/connect = Conexión
tools/rpg_object_editor/connect_tip = Los segmentos con la misma clave de conexión se unen. Vacío — el id del objeto
tools/rpg_object_editor/along = Dirección
tools/rpg_object_editor/along_tip = Dirección del plano vertical en isométrico: auto — según los vecinos, o x o y
tools/rpg_object_editor/part_image = Imagen
tools/rpg_object_editor/part_image_tip = La primera parte del objeto (ruta en rpg_images). Las demás partes están en «otros campos»
tools/rpg_object_editor/geometry = Geometría
tools/rpg_object_editor/geometry_tip = upright — de pie sobre el ancla; ground — tendido en el suelo; plane — plano vertical en una celda; quad — cuadrilátero por sus puntos
tools/rpg_object_editor/crop = Recorte
tools/rpg_object_editor/crop_tip = x, y, w, h en píxeles de la imagen; vacío — toda la imagen
tools/rpg_object_editor/footprint = Celdas
tools/rpg_object_editor/footprint_tip = w, h — cuántas celdas ocupa el objeto (huella, paso, selección)
tools/rpg_object_editor/anchor = Ancla
tools/rpg_object_editor/anchor_tip = x, y en celdas desde la esquina superior izquierda: el punto donde se apoya (orden y base)
tools/rpg_object_editor/charset = Charset
tools/rpg_object_editor/charset_tip = Hoja de caminar en el grupo charsets (3 columnas × 4 filas)
tools/rpg_object_editor/facing = Mirada
tools/rpg_object_editor/column = Columna
tools/rpg_object_editor/trigger = Disparador
tools/rpg_object_editor/trigger_tip = Use — cuando el jugador pulsa la acción cerca; Step — al pisar la celda
tools/rpg_object_editor/scenario = Escenario
tools/rpg_object_editor/scenario_tip = Ruta de un escenario (grupo scenarios). Las líneas de órdenes y el teletransporte están en «otros campos»
tools/rpg_object_editor/projection = Proyección
tools/rpg_object_editor/projection_tip = Qué proyecciones mostrar: ambas juntas, solo cenital o solo isométrica
tools/rpg_object_editor/projection_both = Ambas
tools/rpg_object_editor/projection_top = Cenital
tools/rpg_object_editor/projection_iso = Isométrica
tools/rpg_object_editor/renderer_missing = La proyección «{0}» no está cargada: hace falta su mod de render
tools/rpg_object_editor/commands = Líneas de guion
tools/rpg_object_editor/commands_tip = Líneas que ejecuta la interacción, una por línea. Con un teletransporte no hacen falta.
tools/rpg_object_editor/dialog_map = Elija un mapa
tools/rpg_object_editor/dialog_scenario = Elija un escenario
tools/rpg_object_editor/diffuse_on = Mezclar con los vecinos
tools/rpg_object_editor/diffuse_on_tip = Desactivado para suelos nítidos: el material no se mezcla con los vecinos.
tools/rpg_object_editor/drag_hint = Arrastre el marcador amarillo del ancla en cualquier vista previa para fijar dónde está el objeto. Se usa la celda bajo el puntero.
tools/rpg_object_editor/draw_order = Orden de dibujo
tools/rpg_object_editor/draw_order_default = según la geometría
tools/rpg_object_editor/draw_order_tip = Cuándo se dibujan las partes frente a los personajes. Vacío: cada parte decide.
tools/rpg_object_editor/facing_keep = mantener
tools/rpg_object_editor/footprint_cell_tip = Haga clic para cambiar la celda entre bloqueante (#) y libre (.)
tools/rpg_object_editor/footprint_height = Alto (celdas)
tools/rpg_object_editor/footprint_width = Ancho (celdas)
tools/rpg_object_editor/footprint_mask_hint = # bloquea el paso, . está libre. Un tamaño nuevo devuelve la máscara a la solidez del objeto.
tools/rpg_object_editor/hidden = Oculto
tools/rpg_object_editor/hidden_tip = No se dibuja, no es sólido ni interactivo (un objeto recogido, un enemigo vencido).
tools/rpg_object_editor/import = Importar PNG...
tools/rpg_object_editor/import_bad_name = La imagen necesita un nombre de archivo y una categoría con letras, cifras, _ o -.
tools/rpg_object_editor/import_done = Imagen importada: {0}
tools/rpg_object_editor/import_empty = La imagen está vacía (ancho o alto 0).
tools/rpg_object_editor/import_exists = rpg_images/{0}.png ya existe. Elija otro nombre de archivo.
tools/rpg_object_editor/import_grid = {0} x {1} px: un lado no es múltiplo del tamaño de celda ({2} px). Las partes se cortarán o dejarán huecos en la rejilla.
tools/rpg_object_editor/import_hint = El PNG se copia a rpg_images/<categoría>/ de este mod y se usa como imagen.
tools/rpg_object_editor/import_not_for_actor = Un actor usa un charset, no una imagen. Importe un PNG a un sprite, una superficie o un segmento.
tools/rpg_object_editor/import_not_png = El archivo no es una imagen PNG.
tools/rpg_object_editor/import_read = No se puede leer el archivo: {0}
tools/rpg_object_editor/import_surface_size = {0} x {1} px: un material de superficie debería ser un cuadrado de {3} px (el tamaño de parche del mapa). Se importa igualmente.
tools/rpg_object_editor/import_title = Elija un PNG para importar
tools/rpg_object_editor/interact_add = Añadir interacción
tools/rpg_object_editor/interact_clear = Quitar interacción
tools/rpg_object_editor/light_add = Añadir luz
