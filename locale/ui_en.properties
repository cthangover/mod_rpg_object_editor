mod_rpg_object_editor_name = RPG Object Editor
mod_rpg_object_editor_desc = Edits RPG objects (surfaces, walls, props, characters) while the game runs: a form by shape, picture, footprint, anchor, interaction and inheritance. A preview top-down and isometric, drawn by the game itself. A foreign object is edited as a patch in your own mod.
tools/rpg_object_editor/title = RPG objects
tools/rpg_object_editor/form = Form
tools/rpg_object_editor/form_tip = surface — ground material; segment — one wall or fence cell; sprite — an object on the grid; actor — a character on one cell
tools/rpg_object_editor/name = Name
tools/rpg_object_editor/category = Category
tools/rpg_object_editor/category_tip = A free tag for the palette and the picture folder: container, vegetation, building…
tools/rpg_object_editor/extends = Extends
tools/rpg_object_editor/extends_tip = The parent object's id: fields this object does not set are taken from it
tools/rpg_object_editor/material = Material
tools/rpg_object_editor/material_tip = A square material picture (side = the map's PatchSize) in the rpg_images group
tools/rpg_object_editor/diffuse = Blending
tools/rpg_object_editor/diffuse_tip = Width of the blend into neighbouring materials (DiffuseStrength); 0 — a hard edge
tools/rpg_object_editor/segment_image = Cell picture
tools/rpg_object_editor/segment_image_tip = One cell wide; the height is Segment.Height. The game builds corners and T-junctions
tools/rpg_object_editor/connect = Connect
tools/rpg_object_editor/connect_tip = Segments with the same connect key join each other. Empty — the object id
tools/rpg_object_editor/along = Along
tools/rpg_object_editor/along_tip = Direction of the vertical plane in isometric: auto — from the neighbours, or x or y
tools/rpg_object_editor/part_image = Picture
tools/rpg_object_editor/part_image_tip = The object's first part (a path in rpg_images). The other parts are in "other fields"
tools/rpg_object_editor/geometry = Geometry
tools/rpg_object_editor/geometry_tip = upright — stands on the anchor; ground — lies on the ground; plane — a vertical plane on a cell; quad — a quadrilateral through its points
tools/rpg_object_editor/crop = Crop
tools/rpg_object_editor/crop_tip = x, y, w, h in picture pixels; empty — the whole picture
tools/rpg_object_editor/footprint = Cells
tools/rpg_object_editor/footprint_tip = w, h — how many cells the object takes (footprint, walkability, selection)
tools/rpg_object_editor/anchor = Anchor
tools/rpg_object_editor/anchor_tip = x, y in cells from the object's top-left corner: the point it stands on (sorting and base)
tools/rpg_object_editor/charset = Charset
tools/rpg_object_editor/charset_tip = The walking sheet in the charsets group (3 columns × 4 rows)
tools/rpg_object_editor/facing = Facing
tools/rpg_object_editor/column = Column
tools/rpg_object_editor/trigger = Trigger
tools/rpg_object_editor/trigger_tip = Use — when the player presses the action key nearby; Step — when they step onto the cell
tools/rpg_object_editor/scenario = Scenario
tools/rpg_object_editor/scenario_tip = Path of a scenario (the scenarios group). Command lines and a teleport are in "other fields"
tools/rpg_object_editor/projection = Projection
tools/rpg_object_editor/projection_tip = Which projections to show: both side by side, top-down only or isometric only
tools/rpg_object_editor/projection_both = Both
tools/rpg_object_editor/projection_top = Top-down
tools/rpg_object_editor/projection_iso = Isometric
tools/rpg_object_editor/renderer_missing = Projection "{0}" is not loaded: its render mod is needed
tools/rpg_object_editor/commands = Script lines
tools/rpg_object_editor/commands_tip = Lines the interaction runs, one per line. A teleport is set without them.
tools/rpg_object_editor/dialog_map = Choose a map
tools/rpg_object_editor/dialog_scenario = Choose a scenario
tools/rpg_object_editor/diffuse_on = Blend into neighbours
tools/rpg_object_editor/diffuse_on_tip = Off for crisp floors: the material does not blend with the materials next to it.
tools/rpg_object_editor/drag_hint = Drag the yellow anchor marker on either preview to set where the object stands. The cell under the pointer is used.
tools/rpg_object_editor/draw_order = Draw order
tools/rpg_object_editor/draw_order_default = by geometry
tools/rpg_object_editor/draw_order_tip = When the parts are drawn against characters. Empty: each part decides.
tools/rpg_object_editor/facing_keep = keep
tools/rpg_object_editor/footprint_cell_tip = Click to switch the cell between blocking (#) and free (.)
