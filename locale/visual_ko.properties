tools/rpg_object_editor/visual_parts = 파트 시각 편집기
tools/rpg_object_editor/visual_add = 선택 파트 위에 이미지 추가
tools/rpg_object_editor/visual_move = 이동 / 크기 변경
tools/rpg_object_editor/visual_sort = 깊이 기준점 배치
tools/rpg_object_editor/visual_probe = 확인용 캐릭터 배치
tools/rpg_object_editor/visual_fit = 전체 보기
tools/rpg_object_editor/visual_hint = 왼쪽 버튼으로 선택 및 이동, 흰 모서리로 크기 변경. 책상 앞쪽 바닥에 깊이점을 놓으세요. 휠로 확대, 가운데 버튼으로 보기 이동, Esc로 드래그 취소.
tools/rpg_object_editor/visual_apply = 오브젝트에 적용
tools/rpg_object_editor/visual_cancel = 적용 없이 닫기
tools/rpg_object_editor/visual_plane = plane 파트는 깊이점과 확인용 캐릭터를 지원합니다. 평면 형상은 기본 양식에서 편집하세요.
tools/rpg_object_editor/visual_below = 캐릭터 뒤
tools/rpg_object_editor/visual_depth = 깊이 순서
tools/rpg_object_editor/visual_above = 캐릭터 앞
