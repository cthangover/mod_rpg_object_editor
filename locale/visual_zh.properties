tools/rpg_object_editor/visual_parts = 部件可视化编辑器
tools/rpg_object_editor/visual_add = 在所选部件上添加图片
tools/rpg_object_editor/visual_move = 移动 / 调整大小
tools/rpg_object_editor/visual_sort = 放置深度排序点
tools/rpg_object_editor/visual_probe = 放置测试角色
tools/rpg_object_editor/visual_fit = 显示全部
tools/rpg_object_editor/visual_hint = 左键选择并移动，白色角点调整大小。在桌子前沿底部放置深度点。滚轮缩放，中键移动视图，Esc取消拖动。
tools/rpg_object_editor/visual_apply = 应用到对象
tools/rpg_object_editor/visual_cancel = 关闭且不应用
tools/rpg_object_editor/visual_plane = plane部件支持深度点和测试角色。请在主表单中编辑平面几何。
tools/rpg_object_editor/visual_below = 角色后方
tools/rpg_object_editor/visual_depth = 按深度排序
tools/rpg_object_editor/visual_above = 角色前方
