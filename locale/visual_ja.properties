tools/rpg_object_editor/visual_parts = パーツのビジュアル編集
tools/rpg_object_editor/visual_add = 選択パーツの上に画像を追加
tools/rpg_object_editor/visual_move = 移動 / サイズ変更
tools/rpg_object_editor/visual_sort = 奥行き基準点を配置
tools/rpg_object_editor/visual_probe = 確認用キャラクターを配置
tools/rpg_object_editor/visual_fit = 全体を表示
tools/rpg_object_editor/visual_hint = 左ボタンで選択・移動、白い角でサイズ変更。机の手前側の足元に奥行き点を置きます。ホイールで拡大縮小、中ボタンで表示移動、Escでドラッグ取消。
tools/rpg_object_editor/visual_apply = オブジェクトに適用
tools/rpg_object_editor/visual_cancel = 適用せず閉じる
tools/rpg_object_editor/visual_plane = planeでは奥行き点と確認キャラクターを配置できます。平面の形状は元のフォームで編集してください。
tools/rpg_object_editor/visual_below = キャラクターの後ろ
tools/rpg_object_editor/visual_depth = 奥行き順
tools/rpg_object_editor/visual_above = キャラクターの前
