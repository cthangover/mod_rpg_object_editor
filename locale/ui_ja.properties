mod_rpg_object_editor_name = RPGオブジェクトエディタ
mod_rpg_object_editor_desc = RPGオブジェクト（地表、壁、小物、キャラクター）をゲーム実行中に編集します。形状ごとのフォーム、画像、占有マス、基準点、インタラクト、継承。上面図とアイソメトリックのプレビューはゲーム自身が描きます。他の MOD のオブジェクトは自分の MOD へのパッチとして編集します。
tools/rpg_object_editor/title = RPGオブジェクト
tools/rpg_object_editor/form = 形状
tools/rpg_object_editor/form_tip = surface — 地表の素材、segment — 壁や柵の1マス、sprite — マス目上の小物、actor — 1マス上のキャラクター
tools/rpg_object_editor/name = 名前
tools/rpg_object_editor/category = カテゴリ
tools/rpg_object_editor/category_tip = パレットと画像フォルダ用の自由なタグ：container、vegetation、building…
tools/rpg_object_editor/extends = 継承元
tools/rpg_object_editor/extends_tip = 親オブジェクトの ID。ここにないフィールドは親から取られます
tools/rpg_object_editor/material = 素材
tools/rpg_object_editor/material_tip = rpg_images グループの正方形の素材画像（一辺はマップの PatchSize）
tools/rpg_object_editor/diffuse = ブレンド
tools/rpg_object_editor/diffuse_tip = 隣の素材とのにじみの幅（DiffuseStrength）。0 なら硬い境界
tools/rpg_object_editor/segment_image = マスの画像
tools/rpg_object_editor/segment_image_tip = 幅は1マス。高さは Segment.Height。角や T 字は game が組み立てます
tools/rpg_object_editor/connect = 接続
tools/rpg_object_editor/connect_tip = 同じ接続キーのセグメント同士がつながります。空なら オブジェクトの ID
tools/rpg_object_editor/along = 方向
tools/rpg_object_editor/along_tip = アイソメトリックでの垂直面の向き：auto は隣から、x または y
tools/rpg_object_editor/part_image = 画像
tools/rpg_object_editor/part_image_tip = オブジェクトの最初のパーツ（rpg_images 内のパス）。残りのパーツは「その他のフィールド」
tools/rpg_object_editor/geometry = ジオメトリ
tools/rpg_object_editor/geometry_tip = upright — 基準点の上に立つ、ground — 地面に寝る、plane — マス上の垂直面、quad — 点で指定する四角形
tools/rpg_object_editor/crop = 切り抜き
tools/rpg_object_editor/crop_tip = 画像のピクセルで x, y, w, h。空なら画像全体
tools/rpg_object_editor/footprint = マス
tools/rpg_object_editor/footprint_tip = w, h — オブジェクトが占めるマス数（足元、通行判定、選択範囲）
tools/rpg_object_editor/anchor = 基準点
tools/rpg_object_editor/anchor_tip = オブジェクトの左上からのマス単位の x, y。そこに立つ点（並び順と足元）
tools/rpg_object_editor/charset = キャラセット
tools/rpg_object_editor/charset_tip = charsets グループの歩行シート（3列×4行）
tools/rpg_object_editor/facing = 向き
tools/rpg_object_editor/column = 列
tools/rpg_object_editor/trigger = トリガー
tools/rpg_object_editor/trigger_tip = Use — 近くで決定キーを押したとき、Step — マスに入ったとき
tools/rpg_object_editor/scenario = シナリオ
tools/rpg_object_editor/scenario_tip = シナリオのパス（scenarios グループ）。コマンド行とテレポートは「その他のフィールド」
tools/rpg_object_editor/projection = 投影
tools/rpg_object_editor/projection_tip = 表示する投影：両方並べる、上面図だけ、またはアイソメトリックだけ
tools/rpg_object_editor/projection_both = 両方
tools/rpg_object_editor/projection_top = 上面図
tools/rpg_object_editor/projection_iso = アイソメトリック
tools/rpg_object_editor/renderer_missing = 投影「{0}」は読み込まれていません：描画 MOD が必要です
tools/rpg_object_editor/commands = スクリプト行
tools/rpg_object_editor/commands_tip = 操作時に実行する行（1行ずつ）。ワープを設定する場合は不要です。
tools/rpg_object_editor/dialog_map = マップを選択
tools/rpg_object_editor/dialog_scenario = シナリオを選択
tools/rpg_object_editor/diffuse_on = 隣接する素材となじませる
tools/rpg_object_editor/diffuse_on_tip = くっきりした床では無効にします。素材は隣の素材とはなじみません。
tools/rpg_object_editor/drag_hint = どちらのプレビューでも黄色のアンカーマーカーをドラッグすると、オブジェクトの立つ位置を設定できます。ポインタの下のマスが使われます。
tools/rpg_object_editor/draw_order = 描画順
tools/rpg_object_editor/draw_order_default = 形状による
tools/rpg_object_editor/draw_order_tip = パーツがキャラクターとどの順で描かれるか。空欄の場合は各パーツが決めます。
tools/rpg_object_editor/facing_keep = 変更しない
tools/rpg_object_editor/footprint_cell_tip = クリックで、マスを通行不可（#）と通行可（.）の間で切り替えます
tools/rpg_object_editor/footprint_height = 高さ（マス）
tools/rpg_object_editor/footprint_width = 幅（マス）
tools/rpg_object_editor/footprint_mask_hint = # は通行を妨げ、. は通行可能です。サイズを変えると、マスはオブジェクトの固さの設定に戻ります。
tools/rpg_object_editor/hidden = 非表示
tools/rpg_object_editor/hidden_tip = 描画されず、通行を妨げず、操作もできません（拾われた品、倒された敵）。
tools/rpg_object_editor/import = PNG を取り込む...
tools/rpg_object_editor/import_bad_name = 画像にはファイル名と、英字・数字・_・- からなる分類が必要です。
tools/rpg_object_editor/import_done = 画像を取り込みました：{0}
tools/rpg_object_editor/import_empty = 画像が空です（幅または高さが 0）。
tools/rpg_object_editor/import_exists = rpg_images/{0}.png は既にあります。別のファイル名を選んでください。
tools/rpg_object_editor/import_grid = {0} x {1} px：辺がマスの大きさ（{2} px）の倍数ではありません。グリッド上でパーツが切れるか、すき間ができます。
tools/rpg_object_editor/import_hint = PNG は、このモッドの rpg_images/<分類>/ にコピーされ、画像として設定されます。
tools/rpg_object_editor/import_not_for_actor = アクターは画像ではなくキャラクターシート（charset）を使います。PNG はスプライト、サーフェス、セグメントに取り込んでください。
tools/rpg_object_editor/import_not_png = このファイルは PNG 画像ではありません。
tools/rpg_object_editor/import_read = ファイルを読めません：{0}
tools/rpg_object_editor/import_surface_size = {0} x {1} px：サーフェス素材は {3} px の正方形であるべきです（マップのパッチサイズ）。そのまま取り込みます。
tools/rpg_object_editor/import_title = 取り込む PNG を選択
tools/rpg_object_editor/interact_add = 操作を追加
tools/rpg_object_editor/interact_clear = 操作を削除
tools/rpg_object_editor/light_add = 光源を追加
tools/rpg_object_editor/light_at = 位置（マス、空欄 = 中央）
tools/rpg_object_editor/light_at_tip = オブジェクトの原点からのマス単位の位置："x, y"。空欄は占有範囲の中央です。
tools/rpg_object_editor/light_color = 色
tools/rpg_object_editor/light_color_tip = 光の色です。アルファが光の強さになります。
tools/rpg_object_editor/light_item = 光源 {0}
tools/rpg_object_editor/light_main = 主な光源
tools/rpg_object_editor/light_main_tip = オブジェクト自身が発する光（ランプ、炎）。
tools/rpg_object_editor/light_radius = 半径（マス）
tools/rpg_object_editor/light_radius_tip = 光の届く距離。そこで消えていきます。
tools/rpg_object_editor/light_remove = 光源を削除
tools/rpg_object_editor/map_none = マップなし
tools/rpg_object_editor/map_pick = マップを選ぶ...
tools/rpg_object_editor/number_invalid = 数値ではありません。1.5 や 0 のような数値をコンマで区切って入力してください。
tools/rpg_object_editor/part_add = パーツを追加
tools/rpg_object_editor/part_at = 位置のずれ（マス）
tools/rpg_object_editor/part_at_tip = オブジェクトの原点からのパーツの左上："x, y"。空欄は 0, 0。負の値も使えます。
tools/rpg_object_editor/part_down = 下へ
tools/rpg_object_editor/part_id = Id
tools/rpg_object_editor/part_only = 表示する投影
tools/rpg_object_editor/part_only_any = すべての投影
tools/rpg_object_editor/part_only_tip = パーツを一つの投影（topdown または isometric）に限ります。空欄なら両方に表示されます。
tools/rpg_object_editor/part_points = 角（quad）
tools/rpg_object_editor/part_points_tip = 四角形の四隅：左上、右上、右下、左下の順に、それぞれ "x, y, z"、";" で区切ります。形状 quad のときだけ使います。
tools/rpg_object_editor/part_remove = パーツを削除
tools/rpg_object_editor/part_size = 大きさ（マス）
tools/rpg_object_editor/part_size_tip = 幅と高さ（マス）："w, h"。空欄は切り抜きサイズをマップのタイルサイズで割った値です。
tools/rpg_object_editor/part_title = パーツ {0}
tools/rpg_object_editor/part_up = 上へ
tools/rpg_object_editor/route_every = 1 歩あたりの秒数
tools/rpg_object_editor/route_every_tip = 経路の 2 歩の間隔。
tools/rpg_object_editor/route_on = 経路に沿って動く
tools/rpg_object_editor/route_on_tip = オブジェクトが決まった経路を自分で歩きます（通行人、荷車）。
tools/rpg_object_editor/route_repeat = 繰り返す
tools/rpg_object_editor/route_repeat_tip = 最後の歩のあとに経路を最初から始めます。
tools/rpg_object_editor/route_steps = 歩み
tools/rpg_object_editor/route_steps_tip = コンマ区切り：up, down, left, right, random, toward, away, wait, face_up, face_down, face_left, face_right。
tools/rpg_object_editor/scenario_none = シナリオなし
tools/rpg_object_editor/scenario_pick = シナリオを選ぶ...
tools/rpg_object_editor/section_flags = フラグ
tools/rpg_object_editor/section_footprint = 占有範囲
tools/rpg_object_editor/section_interact = 操作
tools/rpg_object_editor/section_lights = 光源
tools/rpg_object_editor/section_parts = パーツ
tools/rpg_object_editor/section_picture = 画像
tools/rpg_object_editor/section_route = 経路
tools/rpg_object_editor/section_states = 状態
tools/rpg_object_editor/section_variants = バリアント
tools/rpg_object_editor/segment_height = 高さ（マス）
tools/rpg_object_editor/segment_height_tip = 柵の区画の高さ（マス）。
tools/rpg_object_editor/show = 表示
tools/rpg_object_editor/show_default = 通常の見た目
tools/rpg_object_editor/show_state = 状態 {0}：{1}
tools/rpg_object_editor/show_tip = プレビューは、オブジェクトの通常の見た目、バリアント、または状態を表示します。
tools/rpg_object_editor/show_variant = バリアント：{0}
tools/rpg_object_editor/solid = 通行を妨げる
tools/rpg_object_editor/solid_default = 形状による
tools/rpg_object_editor/solid_no = いいえ
tools/rpg_object_editor/solid_tip = オブジェクトが通行を妨げるか。形状による場合、スプライトは妨げ、サーフェスは妨げません。
tools/rpg_object_editor/solid_yes = はい
tools/rpg_object_editor/state_add = 状態を追加
tools/rpg_object_editor/state_down = 下へ
tools/rpg_object_editor/state_id = Id
tools/rpg_object_editor/state_item = {0}. {1}
tools/rpg_object_editor/state_remove = 状態を削除
tools/rpg_object_editor/state_up = 上へ
tools/rpg_object_editor/state_when = 条件
tools/rpg_object_editor/state_when_tip = 条件が成り立つ間、その状態が適用されます。例：self.open == 1。成り立つ最後の状態が優先されます。
tools/rpg_object_editor/tele_dir = 到着時の向き
tools/rpg_object_editor/tele_tip = 移動先マップでプレイヤーが到着するマス。
tools/rpg_object_editor/tele_x = 列（x）
tools/rpg_object_editor/tele_y = 行（y）
tools/rpg_object_editor/teleport = ワープ先
tools/rpg_object_editor/teleport_remove = ワープを削除
tools/rpg_object_editor/variant_add = バリアントを追加
tools/rpg_object_editor/variant_name = バリアント名（例：winter）
tools/rpg_object_editor/variant_picture = 画像
tools/rpg_object_editor/variant_picture_tip = このバリアントが代わりに使う画像。
tools/rpg_object_editor/variant_remove = バリアントを削除
tools/rpg_object_editor/water = 水
tools/rpg_object_editor/water_tip = 表面が水です。
tools/rpg_object_editor/part_sort_offset = 並べ替えの位置ずれ（マス）
