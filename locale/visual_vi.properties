tools/rpg_object_editor/visual_parts = Chỉnh sửa bộ phận trực quan
tools/rpg_object_editor/visual_add = Thêm ảnh lên bộ phận đã chọn
tools/rpg_object_editor/visual_move = Di chuyển / đổi kích thước
tools/rpg_object_editor/visual_sort = Đặt điểm chiều sâu
tools/rpg_object_editor/visual_probe = Đặt nhân vật thử
tools/rpg_object_editor/visual_fit = Xem toàn bộ
tools/rpg_object_editor/visual_hint = Chuột trái chọn và di chuyển; góc trắng đổi kích thước. Đặt điểm chiều sâu ở chân mép trước bàn. Cuộn để phóng, chuột giữa kéo khung nhìn, Esc hủy kéo.
tools/rpg_object_editor/visual_apply = Áp dụng vào vật thể
tools/rpg_object_editor/visual_cancel = Đóng không áp dụng
tools/rpg_object_editor/visual_plane = Bộ phận plane hỗ trợ điểm chiều sâu và nhân vật thử. Sửa hình học mặt phẳng trong biểu mẫu chính.
tools/rpg_object_editor/visual_below = Sau nhân vật
tools/rpg_object_editor/visual_depth = Theo chiều sâu
tools/rpg_object_editor/visual_above = Trước nhân vật
