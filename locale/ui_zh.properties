mod_rpg_object_editor_name = RPG 对象编辑器
mod_rpg_object_editor_desc = 运行中编辑 RPG 对象（地面、墙、道具、角色）：按形状显示表单、图片、占地格、锚点、交互与继承。俯视与等距预览由游戏本身绘制。其他模组的对象以补丁形式写入你自己的模组。
tools/rpg_object_editor/title = RPG 对象
tools/rpg_object_editor/form = 形状
tools/rpg_object_editor/form_tip = surface — 地面材质；segment — 墙或栅栏的一格；sprite — 网格上的物件；actor — 占一格的角色
tools/rpg_object_editor/name = 名称
tools/rpg_object_editor/category = 类别
tools/rpg_object_editor/category_tip = 调色板与图片目录用的自由标签：container、vegetation、building…
tools/rpg_object_editor/extends = 继承自
tools/rpg_object_editor/extends_tip = 父对象的 id：本对象没有的字段取自它
tools/rpg_object_editor/material = 材质
tools/rpg_object_editor/material_tip = rpg_images 组中的方形材质图（边长为地图的 PatchSize）
tools/rpg_object_editor/diffuse = 混合
tools/rpg_object_editor/diffuse_tip = 与相邻材质过渡的宽度（DiffuseStrength）；0 为硬边
tools/rpg_object_editor/segment_image = 格子图片
tools/rpg_object_editor/segment_image_tip = 宽一格，高度为 Segment.Height；转角与 T 形由游戏拼接
tools/rpg_object_editor/connect = 连接
tools/rpg_object_editor/connect_tip = 相同连接键的段相互连接。留空则用对象 id
tools/rpg_object_editor/along = 方向
tools/rpg_object_editor/along_tip = 等距视图中竖直面的方向：auto 按相邻段决定，或 x、y
tools/rpg_object_editor/part_image = 图片
tools/rpg_object_editor/part_image_tip = 对象的第一个部件（rpg_images 中的路径）。其余部件在“其他字段”中
tools/rpg_object_editor/geometry = 几何
tools/rpg_object_editor/geometry_tip = upright — 立于锚点；ground — 平铺地面；plane — 格上的竖直面；quad — 按点连成的四边形
tools/rpg_object_editor/crop = 裁剪
tools/rpg_object_editor/crop_tip = x、y、w、h（图片像素）；留空则为整张图
tools/rpg_object_editor/footprint = 格子
tools/rpg_object_editor/footprint_tip = w、h — 对象占用的格数（落足范围、可通行判定、选择）
tools/rpg_object_editor/anchor = 锚点
tools/rpg_object_editor/anchor_tip = 从对象左上角起算的格数 x、y：站立点（排序与底部）
tools/rpg_object_editor/charset = 角色图集
tools/rpg_object_editor/charset_tip = charsets 组中的行走图（3 列 × 4 行）
tools/rpg_object_editor/facing = 朝向
tools/rpg_object_editor/column = 列
tools/rpg_object_editor/trigger = 触发
tools/rpg_object_editor/trigger_tip = Use — 玩家在旁边按动作键时；Step — 踏入该格时
tools/rpg_object_editor/scenario = 剧本
tools/rpg_object_editor/scenario_tip = 剧本路径（scenarios 组）。命令行与传送在“其他字段”中
tools/rpg_object_editor/projection = 投影
tools/rpg_object_editor/projection_tip = 显示哪种投影：并排两者、仅俯视或仅等距
tools/rpg_object_editor/projection_both = 两者
tools/rpg_object_editor/projection_top = 俯视
tools/rpg_object_editor/projection_iso = 等距
tools/rpg_object_editor/renderer_missing = 投影“{0}”未加载：需要其渲染模组
tools/rpg_object_editor/commands = 脚本行
tools/rpg_object_editor/commands_tip = 互动时执行的行，每行一条。设置传送时不需要它们。
tools/rpg_object_editor/dialog_map = 选择地图
tools/rpg_object_editor/dialog_scenario = 选择场景脚本
tools/rpg_object_editor/diffuse_on = 与相邻材质融合
tools/rpg_object_editor/diffuse_on_tip = 对清晰的地板关闭：材质不与旁边的材质融合。
tools/rpg_object_editor/drag_hint = 在任一预览上拖动黄色锚点标记，设定对象所站的位置。使用指针下的格子。
tools/rpg_object_editor/draw_order = 绘制顺序
tools/rpg_object_editor/draw_order_default = 按几何形状
tools/rpg_object_editor/draw_order_tip = 部件与角色之间的绘制关系。留空：每个部件自行决定。
tools/rpg_object_editor/facing_keep = 保持
tools/rpg_object_editor/footprint_cell_tip = 点击在阻挡（#）和可通行（.）之间切换该格
tools/rpg_object_editor/footprint_height = 高（格）
tools/rpg_object_editor/footprint_width = 宽（格）
tools/rpg_object_editor/footprint_mask_hint = # 阻挡行走，. 可通行。改变尺寸会把遮罩恢复为对象的固体设置。
tools/rpg_object_editor/hidden = 隐藏
tools/rpg_object_editor/hidden_tip = 不绘制、不阻挡、不可互动（被拾取的物品、被击败的敌人）。
tools/rpg_object_editor/import = 导入 PNG...
tools/rpg_object_editor/import_bad_name = 图片需要文件名，分类只能由字母、数字、_ 或 - 组成。
tools/rpg_object_editor/import_done = 图片已导入：{0}
tools/rpg_object_editor/import_empty = 图片为空（宽或高为 0）。
tools/rpg_object_editor/import_exists = rpg_images/{0}.png 已存在。请选择另一个文件名。
tools/rpg_object_editor/import_grid = {0} x {1} px：边长不是地图格子尺寸（{2} px）的倍数。部件在网格上会被切掉或留下缝隙。
tools/rpg_object_editor/import_hint = PNG 会复制到本模组的 rpg_images/<分类>/ 中并设为图片。
tools/rpg_object_editor/import_not_for_actor = 角色使用角色表（charset），而不是图片。请把 PNG 导入精灵、表面或分段。
tools/rpg_object_editor/import_not_png = 该文件不是 PNG 图片。
tools/rpg_object_editor/import_read = 无法读取文件：{0}
tools/rpg_object_editor/import_surface_size = {0} x {1} px：表面材质应为 {3} px 的正方形（地图的补丁尺寸）。仍会导入。
tools/rpg_object_editor/import_title = 选择要导入的 PNG
tools/rpg_object_editor/interact_add = 添加互动
tools/rpg_object_editor/interact_clear = 移除互动
tools/rpg_object_editor/light_add = 添加光源
tools/rpg_object_editor/light_at = 位置（格，留空 = 中心）
tools/rpg_object_editor/light_at_tip = 光源相对对象原点的位置（格）："x, y"。留空表示占地中心。
tools/rpg_object_editor/light_color = 颜色
tools/rpg_object_editor/light_color_tip = 光的颜色。其透明度即为强度。
tools/rpg_object_editor/light_item = 光源 {0}
tools/rpg_object_editor/light_main = 主光源
tools/rpg_object_editor/light_main_tip = 对象自身发出的光（灯、火焰）。
tools/rpg_object_editor/light_radius = 半径（格）
tools/rpg_object_editor/light_radius_tip = 光照到的距离，在此处逐渐变为零。
tools/rpg_object_editor/light_remove = 移除光源
tools/rpg_object_editor/map_none = 无地图
tools/rpg_object_editor/map_pick = 选择地图...
tools/rpg_object_editor/number_invalid = 不是数字。请使用 1.5 或 0 这样的数字，用逗号分隔。
tools/rpg_object_editor/part_add = 添加部件
tools/rpg_object_editor/part_at = 偏移（格）
tools/rpg_object_editor/part_at_tip = 部件左上角相对对象原点的位置："x, y"。留空为 0, 0。允许负值。
tools/rpg_object_editor/part_down = 下移
tools/rpg_object_editor/part_id = Id
tools/rpg_object_editor/part_only = 显示于
tools/rpg_object_editor/part_only_any = 每个投影
tools/rpg_object_editor/part_only_tip = 将部件限定于一种投影（topdown 或 isometric）。留空则两种都显示。
tools/rpg_object_editor/part_points = 角点（quad）
tools/rpg_object_editor/part_points_tip = 四边形的四个角：左上、右上、右下、左下，每个为 "x, y, z"，以 ";" 分隔。仅用于 quad 几何。
tools/rpg_object_editor/part_remove = 移除部件
tools/rpg_object_editor/part_size = 尺寸（格）
tools/rpg_object_editor/part_size_tip = 宽和高（格）："w, h"。留空则为裁剪尺寸除以地图格子尺寸。
tools/rpg_object_editor/part_title = 部件 {0}
tools/rpg_object_editor/part_up = 上移
tools/rpg_object_editor/route_every = 每步秒数
tools/rpg_object_editor/route_every_tip = 路线两步之间的时间。
tools/rpg_object_editor/route_on = 沿路线移动
tools/rpg_object_editor/route_on_tip = 对象自行沿固定路线行走（路人、马车）。
tools/rpg_object_editor/route_repeat = 重复
tools/rpg_object_editor/route_repeat_tip = 走完最后一步后从头开始。
tools/rpg_object_editor/route_steps = 步骤
tools/rpg_object_editor/route_steps_tip = 用逗号分隔：up, down, left, right, random, toward, away, wait, face_up, face_down, face_left, face_right。
tools/rpg_object_editor/scenario_none = 无场景
tools/rpg_object_editor/scenario_pick = 选择场景...
tools/rpg_object_editor/section_flags = 标志
tools/rpg_object_editor/section_footprint = 占地
tools/rpg_object_editor/section_interact = 互动
tools/rpg_object_editor/section_lights = 光源
tools/rpg_object_editor/section_parts = 部件
tools/rpg_object_editor/section_picture = 图片
tools/rpg_object_editor/section_route = 路线
tools/rpg_object_editor/section_states = 状态
tools/rpg_object_editor/section_variants = 变体
tools/rpg_object_editor/segment_height = 高（格）
tools/rpg_object_editor/segment_height_tip = 栅栏段的高度（格）。
tools/rpg_object_editor/show = 显示
tools/rpg_object_editor/show_default = 对象原样
tools/rpg_object_editor/show_state = 状态 {0}：{1}
tools/rpg_object_editor/show_tip = 预览显示对象的默认外观、某个变体或某个状态。
tools/rpg_object_editor/show_variant = 变体：{0}
tools/rpg_object_editor/solid = 阻挡行走
tools/rpg_object_editor/solid_default = 按形状
tools/rpg_object_editor/solid_no = 否
tools/rpg_object_editor/solid_tip = 对象是否阻挡行走。按形状：精灵阻挡，表面不阻挡。
tools/rpg_object_editor/solid_yes = 是
tools/rpg_object_editor/state_add = 添加状态
tools/rpg_object_editor/state_down = 下移
tools/rpg_object_editor/state_id = Id
tools/rpg_object_editor/state_item = {0}. {1}
tools/rpg_object_editor/state_remove = 移除状态
tools/rpg_object_editor/state_up = 上移
tools/rpg_object_editor/state_when = 条件
tools/rpg_object_editor/state_when_tip = 条件成立时该状态生效。例如：self.open == 1。最后一个成立的状态生效。
tools/rpg_object_editor/tele_dir = 到达时的朝向
tools/rpg_object_editor/tele_tip = 玩家到达目标地图的格子。
tools/rpg_object_editor/tele_x = 列（x）
tools/rpg_object_editor/tele_y = 行（y）
tools/rpg_object_editor/teleport = 传送到
tools/rpg_object_editor/teleport_remove = 移除传送
tools/rpg_object_editor/variant_add = 添加变体
tools/rpg_object_editor/variant_name = 变体名（例如 winter）
tools/rpg_object_editor/variant_picture = 图片
tools/rpg_object_editor/variant_picture_tip = 该变体改用的图片。
tools/rpg_object_editor/variant_remove = 移除变体
tools/rpg_object_editor/water = 水
tools/rpg_object_editor/water_tip = 表面是水。
tools/rpg_object_editor/part_sort_offset = 排序偏移（格）
